# Connection settings of the Operations push collectors
#   ops_metric_push.sh, gpu_metric_push.sh, vmkperf_ops_push/vmkperf_ops_push.py
# Keep this file in the folder of the script and fill in the four values. chmod 600.
# Git holds this file with the keys only: never commit it with values.
#
# Format: KEY=VALUE, one per line. A line that starts with # is a comment.
# The file is read as text, never executed. A command-line option or an environment
# variable (OPS_HOST, OPS_USER, OPS_PASSWORD) takes precedence over this file.

# Operations (metrics) address or IP
OPS_HOST=

# Operations account (LOCAL accounts only)
OPS_USER=

# Key that decrypts OPS_PASS_ENC
OPS_ENC_KEY=

# Encrypted password ("bash ops_metric_push.sh --encrypt" asks for the password and prints this line)
OPS_PASS_ENC=
